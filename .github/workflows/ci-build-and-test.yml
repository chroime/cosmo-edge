name: Build and Test (x86)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test x86 workflow routing and required result
        run: python3 -m unittest discover -s test -p 'test_x86_workflow.py'

      - name: Determine whether x86 compilation is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              echo "required=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request)
              : "${BASE_SHA:?Missing PR base SHA}"
              : "${HEAD_SHA:?Missing PR head SHA}"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT
          # Match the PR diff, including both sides of renames and deletions.
          # Capture git's exit code before reading its NUL-delimited output.
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" -- > "$changed_files"
          required=false
          while IFS= read -r -d '' file; do
            case "$file" in
              src/*|test/*|cmake/*|3rd/*|prebuild/ffmpeg/x86_64/*|toolchains/*|CMakeLists.txt|scripts/build_cpu_test.sh|tools/test_watchdog_driver.py|.github/workflows/ci-build-and-test.yml)
                required=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "required=$required" >> "$GITHUB_OUTPUT"

  x86-tests:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    # Use the same builder image as Dockerfile.x86 — keeps CI and production builds consistent.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cosmo-wander-ai/cosmo_edge-build-env_x86:v1

    timeout-minutes: 60

    env:
      # GitHub Actions runs container jobs with HOME=/github/home, but the
      # builder image installs rustup under /root. rustup derives RUSTUP_HOME
      # from $HOME, so it reads /github/home/.rustup (empty) and aborts with
      # "no default is configured" when tokenizers-cpp invokes cargo to build
      # libtokenizers_c.a. Pin both homes to the image's install — the image
      # PATH already hardcodes /root/.cargo/bin, so this couples no further.
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo

    steps:
      # Container runs as root but workspace is owned by host UID.
      # Suppress git "dubious ownership" errors that break test-reporter.
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      # ── Rust toolchain ───────────────────────────────────────────────
      # With RUSTUP_HOME/CARGO_HOME pinned above, the image's toolchain
      # resolves correctly. Verify it; install stable as a fallback only if
      # a future image ships without one.
      - name: Verify Rust toolchain
        run: |
          if ! cargo --version >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal --no-self-update
            rustup default stable
          fi
          cargo --version

      # ── Build ────────────────────────────────────────────────────────
      - name: Test watchdog backend selection and device failures without hardware
        run: python3 tools/test_watchdog_driver.py

      - name: Configure and build cosmo-tests (x86 CPU backend)
        run: bash scripts/build_cpu_test.sh

      # ── Run tests ────────────────────────────────────────────────────
      - name: Run tests
        run: |
          export LD_LIBRARY_PATH="\
          ${GITHUB_WORKSPACE}/prebuild/ffmpeg/x86_64/lib:\
          ${GITHUB_WORKSPACE}/3rd/onnxruntime-linux-x64-1.26.0/lib:\
          ${GITHUB_WORKSPACE}/build_cpu/thirdparty_install/openssl/lib:\
          ${GITHUB_WORKSPACE}/build_cpu/thirdparty_install/curl/lib:\
          ${GITHUB_WORKSPACE}/build_cpu/thirdparty_install/event/lib:\
          ${GITHUB_WORKSPACE}/build_cpu/thirdparty_install/glog/lib:\
          ${GITHUB_WORKSPACE}/build_cpu/thirdparty_install/mp4v2/lib:\
          ${GITHUB_WORKSPACE}/build_cpu/thirdparty_install/uuid/lib:\
          ${LD_LIBRARY_PATH}"
          ./build_cpu/cosmo-tests -r junit -o test-results.xml

      # ── Upload test results ──────────────────────────────────────────
      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-x86
          path: test-results.xml
          retention-days: 7

      # ── Surface test summary in GitHub UI ────────────────────────────
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Cosmo Tests (x86)
          path: test-results.xml
          reporter: java-junit

  # Keep this required check present even when compilation is not applicable.
  build-and-test:
    needs: [scope, x86-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report required x86 result
        id: result
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUILD_REQUIRED: ${{ needs.scope.outputs.required }}
          BUILD_RESULT: ${{ needs.x86-tests.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" == success ]]; then
            case "$BUILD_REQUIRED:$BUILD_RESULT" in
              true:success)
                echo "Required x86 build and tests passed."
                exit 0
                ;;
              false:skipped)
                echo "No x86 build inputs changed; compilation was not required."
                exit 0
                ;;
            esac
          fi
          echo "x86 validation failed: scope=$SCOPE_RESULT required=$BUILD_REQUIRED build=$BUILD_RESULT" >&2
          exit 1
